packageName: application
summary: |
  应用层：CLI/MCP 共享的 4 个用例 + 核心 DI 容器。
  CoreDIContainer 统一组装 data 层实现（FileSystemRepository / CacheRepositoryImpl /
  CodeParserRepositoryImpl）与 4 个用例，adapter 层经它获取用例，不直接 new data 实现。
  入口：src/application/CoreDIContainer.ts；统一出口 src/application/useCases/index.ts。
  对外依赖：data 层实体、仓储接口与实现。
groups:
  - name: 核心装配
    summary: CoreDIContainer 单例容器：data 实现统一在此组装为 4 个共享用例；不含任何适配器特定依赖
    files:
      - CoreDIContainer.ts
      - index.ts
  - name: 用例契约与出口
    summary: IUseCase 统一执行接口 + useCases 聚合出口（adapter 层的类型/实例获取入口）
    files:
      - useCases/IUseCase.ts
      - useCases/index.ts
  - name: 共享用例
    summary: 4 个 CLI/MCP 共享用例——文件大小检查、依赖链追踪、@intent 投射、文件夹意图清单；均为纯编排，不持有适配器依赖
    files:
      - useCases/CheckFileSizeUseCase.ts
      - useCases/TraceDependencyChainUseCase.ts
      - useCases/ProjectIntentUseCase.ts
      - useCases/ListFolderIntentsUseCase.ts
      - useCases/ProjectIntentUseCase.test.ts
